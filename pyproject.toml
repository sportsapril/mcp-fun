[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-analysis-mcp"
version = "0.1.0"
description = "An MCP server for dataset analysis using Hugging Face Dataset Viewer API"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.1.2",
    "httpx>=0.28.1",
    "playwright>=1.40.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-api-python-client>=2.0.0",
    "keyring>=24.0.0",
    "beautifulsoup4>=4.12.0",
    "anthropic>=0.39.0",
]

[project.scripts]
dataset-analysis = "dataset_analysis:main_entry"
twitter-invoice = "twitter_invoice_mcp:main_entry"
gmail-mcp = "gmail_mcp:main_entry"
tripadvisor-mcp = "tripadvisor_mcp:main_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_analysis", "src/twitter_invoice_mcp", "src/gmail_mcp", "src/tripadvisor_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]