services:
  - type: web
    name: tripadvisor-fastapi
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd src && pip install -r ../requirements-fastapi.txt && pip install -e .. && playwright install chromium"
    startCommand: "cd src && uvicorn tripadvisor_mcp.fastapi_server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: FASTAPI_API_KEY
        generateValue: true
        # You can set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.12.0"
